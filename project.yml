name: NeatEditor

options:
  bundleIdPrefix: com.x0c
  deploymentTarget:
    macOS: "15.0"
  xcodeVersion: "16.2"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: 6.0
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    ENABLE_HARDENED_RUNTIME: YES
    DEVELOPMENT_TEAM: SHZQ3MWP3B
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "Developer ID Application"
    CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
    OTHER_CODE_SIGN_FLAGS: "--timestamp"
    DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
    MARKETING_VERSION: 1.0.4
    CURRENT_PROJECT_VERSION: 3
  configs:
    Debug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
    Release:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: ""

packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.9.2"

targets:
  NeatEditor:
    type: application
    platform: macOS
    deploymentTarget: "15.0"
    sources:
      - Sources/NeatEditor
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.x0c.NeatEditor
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Sources/NeatEditor/App/Info.plist
        SWIFT_VERSION: 6.0
        MACOSX_DEPLOYMENT_TARGET: "15.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        LD_RUNPATH_SEARCH_PATHS:
          - $(inherited)
          - "@executable_path/../Frameworks"
    dependencies:
      - package: Sparkle
        product: Sparkle

  NeatEditorTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "15.0"
    sources:
      - Tests/NeatEditorTests
    dependencies:
      - target: NeatEditor
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.x0c.NeatEditorTests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: 6.0
        MACOSX_DEPLOYMENT_TARGET: "15.0"

schemes:
  NeatEditor:
    build:
      targets:
        NeatEditor: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - NeatEditorTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
