name: Release Validation

# Tag CI is validation only. It proves the tagged source builds universal
# and packages, and keeps the packages as private workflow artifacts
# (login-gated, expiring). It never creates or touches a public GitHub
# Release: public installs come exclusively from the maintainer's local
# signed + notarized publish (see RELEASING.md R4). Least-privilege token:
# https://docs.github.com/en/actions/writing-workflows/choosing-what-your-workflow-does/controlling-permissions-for-github_token

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-and-validate:
    name: Build And Validate Tag
    runs-on: macos-15

    env:
      APP_NAME: NeatEditor
      PROJECT_FILE: NeatEditor.xcodeproj
      SCHEME: NeatEditor
      DERIVED_DATA_PATH: build/DerivedData
      EXPORT_DIR: build/release

    steps:
      - name: Checkout Tag Source
        uses: actions/checkout@v4

      - name: Select Xcode 16.2
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16.2"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Prepare Build Variables
        shell: bash
        run: |
          set -euo pipefail

          VERSION="${GITHUB_REF_NAME#v}"
          ASSET_BASENAME="${APP_NAME}-${GITHUB_REF_NAME}-macOS-universal"

          {
            echo "VERSION=${VERSION}"
            echo "ASSET_BASENAME=${ASSET_BASENAME}"
            echo "APP_PATH=${DERIVED_DATA_PATH}/Build/Products/Release/${APP_NAME}.app"
            echo "ZIP_PATH=${EXPORT_DIR}/${ASSET_BASENAME}.zip"
            echo "DMG_PATH=${EXPORT_DIR}/${ASSET_BASENAME}.dmg"
            echo "CHECKSUM_PATH=${EXPORT_DIR}/SHA256SUMS.txt"
          } >> "$GITHUB_ENV"

      - name: Build Release App
        shell: bash
        run: |
          set -euo pipefail

          xcodebuild \
            -project "${PROJECT_FILE}" \
            -scheme "${SCHEME}" \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath "${DERIVED_DATA_PATH}" \
            MARKETING_VERSION="${VERSION}" \
            CURRENT_PROJECT_VERSION="${GITHUB_RUN_NUMBER}" \
            ARCHS="arm64 x86_64" \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Verify Universal Binary
        shell: bash
        run: |
          set -euo pipefail

          BINARY_PATH="${APP_PATH}/Contents/MacOS/${APP_NAME}"
          lipo -info "${BINARY_PATH}"

      - name: Package Validation Assets
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "${EXPORT_DIR}"
          ditto -c -k --sequesterRsrc --keepParent "${APP_PATH}" "${ZIP_PATH}"

          STAGE="${EXPORT_DIR}/dmg-stage"
          rm -rf "${STAGE}"
          mkdir -p "${STAGE}"
          ditto "${APP_PATH}" "${STAGE}/${APP_NAME}.app"
          ln -s /Applications "${STAGE}/Applications"
          # The release runner is macos-15, which has no `diskutil image`
          # subcommand (macOS 26+ only), so hdiutil stays until the runner
          # moves to macOS 26 or later.
          hdiutil create \
            -volname "${APP_NAME} ${VERSION}" \
            -srcfolder "${STAGE}" \
            -ov -format UDZO \
            "${DMG_PATH}"

          shasum -a 256 "${ZIP_PATH}" "${DMG_PATH}" > "${CHECKSUM_PATH}"

      - name: Verify Validation Assets
        shell: bash
        run: |
          set -euo pipefail

          test -f "${ZIP_PATH}"
          test -f "${DMG_PATH}"
          test -f "${CHECKSUM_PATH}"
          # These are unsigned build-proof packages for this tag run only.
          # They must never be attached to a public Release.

      - name: Upload Private Validation Artifact
        # Login-gated, expiring workflow artifact — not a public Release.
        # Inputs: https://github.com/actions/upload-artifact
        uses: actions/upload-artifact@v4
        with:
          name: "${{ env.ASSET_BASENAME }}-unsigned-validation"
          path: |
            ${{ env.ZIP_PATH }}
            ${{ env.DMG_PATH }}
            ${{ env.CHECKSUM_PATH }}
          if-no-files-found: error
          retention-days: 14
